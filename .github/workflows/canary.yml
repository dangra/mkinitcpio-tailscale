# The dependency canary. The suite installs whatever Arch ships on the day it
# runs -- nothing but headscale is pinned -- so a failure here with no commit
# behind it means a dependency update broke the hook, before users have to
# find out. Shares its test jobs with ci.yml through tests.yml; only the
# scheduling machinery lives in this file.
name: canary

on:
  schedule:
    - cron: '47 5 * * *'
  # The retry lever: dispatching this workflow runs the suite regardless of
  # what the gate would say.
  workflow_dispatch:

permissions:
  contents: read

# One string, referenced by canary-issue and canary-issue-close alike: the
# close side finds the issue by exact title, so the two must never drift.
env:
  CANARY_ISSUE_TITLE: The dependency canary is failing

concurrency:
  group: ${{ github.workflow }}

jobs:
  # Decides whether today has anything to test: when none of the packages the
  # suite exercises moved since the set the record job stored, the day's run
  # stops here at a few seconds' cost. A manual dispatch of this workflow
  # skips the comparison -- that is the retry lever when a gated day needs a
  # second look. Fail-open by design: a missing baseline, an unreachable
  # archlinux.org, or a package the query cannot resolve all count as changed.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      versions: ${{ steps.cmp.outputs.versions }}
    steps:
      - name: Compare dependency versions with the last tested set
        id: cmp
        env:
          LAST: ${{ vars.CANARY_PKGS }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo 'changed=true' >>"$GITHUB_OUTPUT"
            echo 'versions=' >>"$GITHUB_OUTPUT"
            echo "manual dispatch; testing unconditionally"
            exit 0
          fi
          # The packages that end up in or build the image, plus the ssh
          # tooling. Test-only infrastructure (qemu, headscale, jq) is
          # deliberately absent: an update there cannot break users.
          pkgs='tailscale mkinitcpio linux systemd busybox openssh'
          versions=$(for p in $pkgs; do
            curl -fsS --max-time 15 "https://archlinux.org/packages/search/json/?name=$p" |
              jq -r --arg p "$p" '.results[0] | "\($p)=\(.pkgver)-\(.pkgrel)"' ||
              echo "$p=unknown"
          done | LC_ALL=C sort | paste -sd' ')
          echo "versions=$versions" >>"$GITHUB_OUTPUT"
          if [ -n "$LAST" ] && [ "$versions" = "$LAST" ] && ! grep -q unknown <<<"$versions"; then
            echo "no dependency moved since the last tested set:"
            echo "  $versions"
            echo 'changed=false' >>"$GITHUB_OUTPUT"
          else
            echo "dependencies changed, or no clean baseline:"
            echo "  last:    ${LAST:-<none>}"
            echo "  current: $versions"
            echo 'changed=true' >>"$GITHUB_OUTPUT"
          fi

  tests:
    name: tests
    needs: [gate]
    if: needs.gate.outputs.changed == 'true'
    uses: ./.github/workflows/tests.yml

  # The other half of the gate: remember which dependency set was tested, so
  # tomorrow's gate has something to compare against. Recorded even when the
  # suite fails -- the failure is already filed by canary-issue, and re-running
  # the same versions every day would only re-fail; workflow_dispatch bypasses
  # the gate when a retry is wanted. Failures here only warn: a stale baseline
  # degrades to testing more often, never less.
  record:
    name: record
    if: github.event_name == 'schedule' && needs.gate.outputs.changed == 'true' && !cancelled()
    needs: [gate, tests]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      - name: Record the tested versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSIONS: ${{ needs.gate.outputs.versions }}
        run: |
          if [ -z "$VERSIONS" ]; then
            echo '::warning::gate produced no version set; nothing recorded'
            exit 0
          fi
          if ! gh api -X PATCH "repos/$GH_REPO/actions/variables/CANARY_PKGS" \
              -f name=CANARY_PKGS -f value="$VERSIONS" 2>/dev/null &&
             ! gh api -X POST "repos/$GH_REPO/actions/variables" \
              -f name=CANARY_PKGS -f value="$VERSIONS" 2>/dev/null; then
            echo '::warning::could not update CANARY_PKGS; the next scheduled run will test again'
            exit 0
          fi
          echo "recorded: $VERSIONS"

  # When a canary run fails, file the failure where it will be seen.
  # Scheduled-run failure emails go only to whoever last touched the cron line
  # and are easy to miss; an issue is visible to anyone watching the repo and
  # holds the investigation. One issue per breakage: repeat failures comment
  # on it, and the close job below retires it when a run passes again.
  canary-issue:
    name: canary-issue
    if: failure()
    needs: [gate, tests]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - name: Open or update the canary issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title=$CANARY_ISSUE_TITLE
          existing=$(gh issue list --state open --json title,number \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
            echo "commented on existing issue #$existing"
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<EOF
          The scheduled CI run failed with no commit behind it, which means an
          update of a dependency -- tailscale, mkinitcpio, linux or openssh --
          broke the hook. Users installing or rebuilding today are likely
          affected.

          Failed run: $RUN_URL

          To reproduce locally against current packages:

              make test-all

          This issue was opened automatically by the canary-issue job in
          .github/workflows/canary.yml; further failures will be added as
          comments while it stays open; a canary run
          that passes again closes it.
          EOF
          )"

  # The recovery side of canary-issue: a canary that passes -- the next
  # dependency bump going green, or a manual dispatch after a fix -- closes
  # the open issue with the run that proved it, so the issue's lifetime is
  # exactly the breakage's. A later failure opens a fresh issue rather than
  # reopening this one, which keeps one investigation per issue.
  canary-issue-close:
    name: canary-issue-close
    if: needs.tests.result == 'success'
    needs: [gate, tests]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - name: Close the canary issue if one is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --json title,number \
            --jq ".[] | select(.title == \"$CANARY_ISSUE_TITLE\") | .number" | head -1)
          if [ -z "$existing" ]; then
            echo "no open canary issue; nothing to close"
            exit 0
          fi
          gh issue close "$existing" --comment "Passing again: $RUN_URL"
          echo "closed issue #$existing"

  # Scheduled workflows are disabled after 60 days without repository
  # activity, and scheduled runs themselves do not count as activity. The
  # enable call below does reset that timer, so each daily run re-arms the
  # schedule and the canary keeps running through quiet stretches -- without
  # the keep-alive commits the alternative would scatter over a branch.
  keepalive:
    name: keepalive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      - name: Re-arm the schedule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/canary.yml/enable"
