name: CI

on:
  push:
    # Branch work is covered by pull_request; listing every branch here as well
    # would run the whole suite twice for any branch with a PR open.
    branches: [master]
    # A release is a tag push, handled by the publish job below. Keeping it in
    # this workflow means the release runs the same jobs as everything else,
    # rather than a separate copy that only executes a few times a year.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # The suite installs whatever Arch ships on the day it runs -- nothing but
    # headscale is pinned -- so this daily run is the dependency canary: a
    # failure with no commit behind it means a dependency update broke the
    # hook, before users have to find out. The gate job keeps the daily
    # cadence cheap by skipping the suite when no dependency version moved
    # since the last tested set; a failure opens (or updates) a GitHub issue
    # via the canary-issue job, and the keepalive job stops GitHub's 60-day
    # inactivity rule from switching the schedule off.
    - cron: '47 5 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether a scheduled run has anything to test. The canary exists to
  # catch dependency updates, so when none of the packages the suite exercises
  # moved since the set recorded by the record job, the day's run stops here
  # at a few seconds' cost. Everything that is not a schedule -- pushes, pull
  # requests, tags, manual dispatch -- passes through unconditionally, which
  # also makes workflow_dispatch the retry lever when a gated day needs a
  # second look. Fail-open by design: a missing baseline, an unreachable
  # archlinux.org, or a package the query cannot resolve all count as changed.
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      versions: ${{ steps.cmp.outputs.versions }}
    steps:
      - name: Compare dependency versions with the last tested set
        id: cmp
        env:
          LAST: ${{ vars.CANARY_PKGS }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo 'changed=true' >>"$GITHUB_OUTPUT"
            echo 'versions=' >>"$GITHUB_OUTPUT"
            echo "not a scheduled run; testing unconditionally"
            exit 0
          fi
          # The packages that end up in or build the image, plus the ssh
          # tooling. Test-only infrastructure (qemu, headscale, jq) is
          # deliberately absent: an update there cannot break users.
          pkgs='tailscale mkinitcpio linux systemd busybox openssh'
          versions=$(for p in $pkgs; do
            curl -fsS --max-time 15 "https://archlinux.org/packages/search/json/?name=$p" |
              jq -r --arg p "$p" '.results[0] | "\($p)=\(.pkgver)-\(.pkgrel)"' ||
              echo "$p=unknown"
          done | LC_ALL=C sort | paste -sd' ')
          echo "versions=$versions" >>"$GITHUB_OUTPUT"
          if [ -n "$LAST" ] && [ "$versions" = "$LAST" ] && ! grep -q unknown <<<"$versions"; then
            echo "no dependency moved since the last tested set:"
            echo "  $versions"
            echo 'changed=false' >>"$GITHUB_OUTPUT"
          else
            echo "dependencies changed, or no clean baseline:"
            echo "  last:    ${LAST:-<none>}"
            echo "  current: $versions"
            echo 'changed=true' >>"$GITHUB_OUTPUT"
          fi

  lint:
    name: lint
    needs: [gate]
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 10
    steps:
      # git has to be installed before actions/checkout, otherwise it falls back
      # to downloading a REST tarball.
      - name: Bootstrap
        run: pacman -Syu --noconfirm --needed git shellcheck mkinitcpio

      - uses: actions/checkout@v7

      # Findings from shellcheck are reported but do not fail the build; syntax
      # errors do. See tests/01-lint.sh.
      - name: Static checks
        run: ./tests/01-lint.sh

  package:
    name: package
    needs: [gate]
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Bootstrap
        run: |
          pacman -Syu --noconfirm --needed git pacman-contrib namcap mkinitcpio
          # makepkg refuses to run as root, and that guard also covers
          # --printsrcinfo and the `makepkg -g` that updpkgsums shells out to.
          useradd -m builder

      - uses: actions/checkout@v7

      - name: Prepare workspace
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          install -d -o builder -g builder "$GITHUB_WORKSPACE/dist"
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Metadata, makepkg, namcap and payload checks
        run: runuser -u builder -- ./tests/02-package.sh
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/dist

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: dist/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  initramfs:
    name: initramfs
    needs: [gate]
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Bootstrap
        run: |
          # Installing a kernel triggers mkinitcpio -P against the stock preset,
          # which cannot work in a container (autodetect needs the real host).
          # Disabling only this hook keeps 60-depmod.hook, which the tests need
          # for modules.dep.
          install -d /etc/pacman.d/hooks
          ln -sf /dev/null /etc/pacman.d/hooks/90-mkinitcpio-install.hook
          # mkinitcpio is named explicitly because linux depends on the virtual
          # "initramfs" provider and --noconfirm could otherwise pick dracut.
          pacman -Syu --noconfirm --needed \
            git mkinitcpio linux tailscale openssh

      - uses: actions/checkout@v7

      # Builds real images for the systemd and busybox variants, with and
      # without Tailscale SSH host keys, plus the guard clauses, and asserts on
      # their contents. Uses the hook files from the working tree
      # -- the package job separately proves the package ships exactly those
      # files at the paths mkinitcpio looks in.
      - name: Build and inspect initramfs images
        run: ./tests/03-initramfs.sh
        env:
          ARTIFACT_DIR: ${{ github.workspace }}/logs

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: initramfs-logs
          path: logs/
          if-no-files-found: ignore

  boot:
    name: boot
    needs: [gate]
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # Two boots -- systemd and busybox -- and a runner without KVM falls back to
    # TCG, where each one can take the full BOOT_TIMEOUT.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Deliberately not a `container:` job. tests/container.sh only passes
      # --device /dev/kvm when the device exists, so a runner without KVM falls
      # back to TCG instead of failing at container creation. It also keeps this
      # identical to how the test runs locally.
      - name: Boot the systemd and busybox images against a throwaway headscale
        run: ./tests/container.sh 04
        env:
          # Runners ship both engines; docker runs rootful here, which is what
          # makes --device /dev/kvm usable.
          ENGINE: docker
          ARTIFACT_DIR: ${{ github.workspace }}/logs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-logs
          path: logs/
          if-no-files-found: ignore

  # The release path. Runs wherever this workflow does: pull requests, pushes to
  # master, and v* tags.
  #
  # For anything that is not a v* tag this is a dry run: it stages the tree,
  # clones the live AUR over HTTPS -- which is anonymous, so no credentials are
  # involved and it works on pull requests from forks -- and prints the diff it
  # would push, then stops. Only a tag reaches the actual push.
  #
  # Deliberately one job rather than a dry-run job here and a release job in a
  # separate workflow. The path that publishes is then exactly the path
  # exercised by every pull request; a second, near-identical copy that runs a
  # few times a year is how a release breaks unnoticed.
  publish:
    name: publish
    # Never push on red tests. This also gates the dry run, which costs about a
    # minute of extra latency on that signal and is worth it for the guarantee.
    needs: [lint, package, initramfs, boot]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20
    steps:
      - name: Bootstrap
        run: |
          pacman -Syu --noconfirm --needed git pacman-contrib openssh
          # makepkg, --printsrcinfo and updpkgsums all refuse to run as root.
          useradd -m builder

      - uses: actions/checkout@v7
        with:
          # Tags for git describe, plus master's history for the ancestry check.
          fetch-depth: 0

      - name: Prepare the workspace
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Refuse to publish a tag that is not on master
        if: github.ref_type == 'tag'
        run: |
          git fetch --quiet origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::${GITHUB_REF_NAME} is not contained in origin/master; refusing to publish unmerged code"
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on master"

      - name: Configure SSH for the AUR
        if: github.ref_type == 'tag'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          [ -n "$AUR_SSH_PRIVATE_KEY" ] || { echo "::error::AUR_SSH_PRIVATE_KEY is not set"; exit 1; }
          install -d -m700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >/home/builder/.ssh/id_ed25519
          # Pinned rather than StrictHostKeyChecking=no, so the push cannot be
          # silently redirected. Fingerprint published by the AUR:
          #   SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          cat >/home/builder/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          EOF
          chmod 600 /home/builder/.ssh/id_ed25519 /home/builder/.ssh/known_hosts
          chown -R builder:builder /home/builder/.ssh

      - name: Publish
        env:
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_AUTHOR_EMAIL: ${{ github.actor }}@users.noreply.github.com
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
            remote=ssh://aur@aur.archlinux.org/mkinitcpio-tailscale.git
            set -- --tag "$tag"
            echo "publishing $tag to $remote"
          else
            # Stage as the most recent release so the diff shows what this commit
            # would change on the AUR, rather than a meaningless version bump.
            tag=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
            remote=https://aur.archlinux.org/mkinitcpio-tailscale.git
            set -- --tag "$tag" --dry-run
            echo "dry run as $tag against $remote"
          fi
          # Pass the environment explicitly rather than relying on how runuser
          # treats it.
          runuser -u builder -- env \
            AUR_REMOTE="$remote" \
            GIT_AUTHOR_NAME="$GIT_AUTHOR_NAME" \
            GIT_AUTHOR_EMAIL="$GIT_AUTHOR_EMAIL" \
            ./scripts/aur-publish.sh "$@"

  # The GitHub side of a release, once the AUR side has landed. Only a tag gets
  # here, and only if publish succeeded, so a release page never advertises a
  # version the AUR does not have.
  release:
    name: release
    if: github.ref_type == 'tag'
    needs: [publish]
    runs-on: ubuntu-latest
    # An Arch container rather than the plain runner: the asset is built with
    # makepkg, from the same staged tree the AUR gets.
    container: archlinux:base-devel
    permissions:
      # The workflow default is read-only; creating a release needs to write.
      contents: write
    timeout-minutes: 20
    steps:
      - name: Bootstrap
        run: |
          pacman -Syu --noconfirm --needed git pacman-contrib github-cli
          # makepkg, --printsrcinfo and updpkgsums all refuse to run as root.
          useradd -m builder

      - uses: actions/checkout@v7

      - name: Prepare the workspace
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # Not the artifact from the package job: tests/02-package.sh stages with
      # the fake tag v9.9.9-3, so what it builds is labelled 9.9.9-3.
      - name: Build the package for this tag
        run: |
          runuser -u builder -- ./scripts/aur-stage.sh "$GITHUB_WORKSPACE/stage" \
            --tag "$GITHUB_REF_NAME"
          runuser -u builder -- env -C "$GITHUB_WORKSPACE/stage" \
            makepkg --noconfirm --nodeps --force

      - name: Create the release
        env:
          # gh in a container has neither credentials nor a repo to infer.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Re-running the job must not fail on a release that already exists.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, nothing to do"
            exit 0
          fi
          # The staged PKGBUILD is the single source of truth for the version;
          # aur-stage.sh has already resolved the tag into it.
          pkgver=$(sed -n 's/^pkgver=//p' stage/PKGBUILD)
          pkgrel=$(sed -n 's/^pkgrel=//p' stage/PKGBUILD)
          # The publish job ran minutes ago, so today is the date this version
          # reached the AUR. Every release carries it: GitHub's own "released"
          # timestamp is not settable, which the releases backfilled in August
          # 2026 all show as the day they were written rather than the day they
          # shipped.
          today=$(date -u +'%-d %B %Y')
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Published to the AUR as \`mkinitcpio-tailscale ${pkgver}-${pkgrel}\` on ${today}." \
            --generate-notes \
            stage/*.pkg.tar.zst

  # When the weekly canary run fails, file the failure where it will be seen.
  # Scheduled-run failure emails go only to whoever last touched the cron line
  # and are easy to miss; an issue is visible to anyone watching the repo and
  # holds the investigation. One issue per breakage, not per week: a rerun
  # while it is still open comments on it instead of opening another.
  canary-issue:
    name: canary-issue
    if: github.event_name == 'schedule' && failure()
    needs: [lint, package, initramfs, boot, publish]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    timeout-minutes: 5
    steps:
      - name: Open or update the canary issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='The weekly dependency canary is failing'
          existing=$(gh issue list --state open --json title,number \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
            echo "commented on existing issue #$existing"
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<EOF
          The scheduled CI run failed with no commit behind it, which means an
          update of a dependency -- tailscale, mkinitcpio, linux or openssh --
          broke the hook. Users installing or rebuilding today are likely
          affected.

          Failed run: $RUN_URL

          To reproduce locally against current packages:

              make test-all

          This issue was opened automatically by the canary-issue job in
          .github/workflows/ci.yml; further weekly failures will be added as
          comments while it stays open.
          EOF
          )"

  # Scheduled workflows are disabled after 60 days without repository
  # activity, and scheduled runs themselves do not count as activity. The
  # enable call below does reset that timer, so each weekly run re-arms the
  # schedule and the canary keeps running through quiet stretches -- without
  # the keep-alive commits the alternative would scatter over a branch.
  keepalive:
    name: keepalive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      - name: Re-arm the schedule
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ci.yml/enable"

  # The other half of the gate: remember which dependency set was tested, so
  # tomorrow's gate has something to compare against. Recorded even when the
  # suite fails -- the failure is already filed by canary-issue, and re-running
  # the same versions every day would only re-fail; workflow_dispatch bypasses
  # the gate when a retry is wanted. Failures here only warn: a stale baseline
  # degrades to testing more often, never less.
  record:
    name: record
    if: github.event_name == 'schedule' && needs.gate.outputs.changed == 'true' && !cancelled()
    needs: [gate, lint, package, initramfs, boot]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      - name: Record the tested versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSIONS: ${{ needs.gate.outputs.versions }}
        run: |
          if [ -z "$VERSIONS" ]; then
            echo '::warning::gate produced no version set; nothing recorded'
            exit 0
          fi
          if ! gh api -X PATCH "repos/$GH_REPO/actions/variables/CANARY_PKGS" \
              -f name=CANARY_PKGS -f value="$VERSIONS" 2>/dev/null &&
             ! gh api -X POST "repos/$GH_REPO/actions/variables" \
              -f name=CANARY_PKGS -f value="$VERSIONS" 2>/dev/null; then
            echo '::warning::could not update CANARY_PKGS; the next scheduled run will test again'
            exit 0
          fi
          echo "recorded: $VERSIONS"
